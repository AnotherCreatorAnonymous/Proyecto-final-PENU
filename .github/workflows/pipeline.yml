name: CI/CD Pan de la Casa

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  unit-tests:
    name: 1. Pruebas Unitarias (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias backend
        working-directory: ./src/backend
        run: npm ci
      - name: Ejecutar pruebas unitarias
        working-directory: ./src/backend
        run: npm test

  deploy:
    name: 2. Terraform IaC + Deploy + Smoke Test
    needs: unit-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login federado en Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
          terraform_wrapper: false

      - name: Terraform Init & Apply
        id: tf
        working-directory: ./infra
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
          TF_VAR_mongodb_uri: ${{ secrets.MONGODB_URI }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_staff_password: ${{ secrets.STAFF_PASSWORD }}
          TF_VAR_admin_password: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          terraform init
          terraform apply -auto-approve
          echo "api_url=$(terraform output -raw api_url)" >> $GITHUB_OUTPUT
          echo "frontend_url=$(terraform output -raw frontend_url)" >> $GITHUB_OUTPUT
          echo "swa_token=$(terraform output -raw swa_deployment_token)" >> $GITHUB_OUTPUT

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend con URL real de Azure Functions
        working-directory: ./src/frontend
        env:
          VITE_API_URL: ${{ steps.tf.outputs.api_url }}
        run: |
          npm ci
          npm run build

      - name: Instalar dependencias de producción Backend
        working-directory: ./src/backend
        run: npm ci --omit=dev

      - name: Desplegar Backend en Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: func-pandelacasa-api
          package: ./src/backend

      - name: Desplegar Frontend en Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.tf.outputs.swa_token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/src/frontend/dist'
          output_location: ''
          skip_app_build: true

      - name: Smoke Test Post-Despliegue
        env:
          BASE_URL: ${{ steps.tf.outputs.api_url }}
        run: |
          echo "Esperando 20 segundos para inicialización de Azure Functions..."
          sleep 20
          node tests/smoke/smoke.js
          echo "Verificando Frontend en ${{ steps.tf.outputs.frontend_url }}..."
          WEB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.tf.outputs.frontend_url }}")
          if [ "$WEB_STATUS" -ne 200 ]; then
            echo "ERROR: Frontend devolvió HTTP $WEB_STATUS"
            exit 1
          fi
          echo "Despliegue y Smoke Test completados exitosamente."